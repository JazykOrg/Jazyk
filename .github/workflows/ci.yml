name: CI

on:
  push:
    branches: [master]
    paths:
      - 'bootstrap/**'
      - 'runtime-worker/**'
      - 'docs/benchmark/cases/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'runtime-worker/**'
      - 'docs/benchmark/cases/**'
      - '.github/workflows/ci.yml'

jobs:
  runtime-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime-worker/go.mod
          cache-dependency-path: runtime-worker/go.sum
      - run: go test ./...
        working-directory: runtime-worker
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bootstrap
      - name: Build
        run: cargo build --release
        working-directory: bootstrap
      - name: Test
        run: cargo test --release
        working-directory: bootstrap
      - name: Check the standalone WASM engine
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --target wasm32-unknown-unknown --lib
        working-directory: bootstrap
