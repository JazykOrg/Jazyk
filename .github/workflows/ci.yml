name: CI

on:
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'runtime-worker/**'
      # Files the engine embeds at compile time (include_str!).
      - 'docs/benchmark/cases/**'
      - 'docs/benchmark/known-results.yaml'
      - 'docs/compiler/goals/**'
      - 'docs/compiler/skills/**'
      - 'docs/compiler/document-sets.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      release_validation:
        description: 'Build the release binary and run tests in the release profile'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: runtime-worker/go.mod
          cache-dependency-path: runtime-worker/go.sum
      - run: go test ./...
        working-directory: runtime-worker
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The toolchain bootstrap/rust-toolchain.toml pins.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bootstrap
      - name: Check formatting
        run: cargo fmt --check
        working-directory: bootstrap
      - name: Test
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_validation }}
        run: cargo test --locked
        working-directory: bootstrap
      - name: Build release binary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_validation }}
        run: cargo build --locked --release
        working-directory: bootstrap
      - name: Test release profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_validation }}
        run: cargo test --locked --release
        working-directory: bootstrap
      - name: Check the standalone WASM engine
        run: cargo check --locked --target wasm32-unknown-unknown --lib
        working-directory: bootstrap
