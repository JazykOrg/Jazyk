name: CI

on:
  push:
    branches: [master]
    paths:
      - 'bootstrap/**'
      - 'docs/benchmark/cases/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'bootstrap/**'
      - 'docs/benchmark/cases/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bootstrap
      - name: Build
        run: cargo build --release
        working-directory: bootstrap
      - name: Test
        run: cargo test --release
        working-directory: bootstrap
      # The app's unit tests need no build and no browser (docs/frontends/wasm.md#building).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bootstrap/app/package-lock.json
      - name: Unit tests of the app
        run: npm ci && npm run test:unit
        working-directory: bootstrap/app
      # A demo that fell behind this compiler is a warning on the run, never a
      # failure (docs/frontends/wasm.md#keeping-the-demos-current).
      - name: Check the demos
        run: sh bootstrap/app/scripts/check-demos.sh bootstrap/target/release/jazyk bootstrap/app/public/demos
      # The check must see a demo fall behind: a copy of one fixture with its store
      # version set back, and one with a diagram's source changed, each warn.
      - name: Check that check-demos.sh sees a stale demo
        run: |
          stale=$(mktemp -d)
          mkdir "$stale/version" "$stale/diagram"
          node -e '
            const fs = require("node:fs")
            const [dest] = process.argv.slice(1)
            const f = JSON.parse(fs.readFileSync("bootstrap/app/public/demos/shop.json", "utf8"))
            const status = ".jazyk/status.yaml"
            fs.writeFileSync(`${dest}/version/shop.json`, JSON.stringify({ ...f, [status]: f[status].replace(/^version: \d+$/m, "version: 1") }))
            const puml = Object.keys(f).find((k) => k.endsWith(".puml"))
            fs.writeFileSync(`${dest}/diagram/shop.json`, JSON.stringify({ ...f, [puml]: f[puml].replace("@startuml", "@startuml\n\x27 not the emitter output") }))
          ' "$stale"
          for case in version diagram; do
            out=$(sh bootstrap/app/scripts/check-demos.sh bootstrap/target/release/jazyk "$stale/$case")
            echo "$out"
            echo "$out" | grep -q '::warning title=demo' || { echo "::error title=check-demos::a fixture with a stale $case did not warn"; exit 1; }
          done
