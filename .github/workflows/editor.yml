name: Deploy editor

# Publishes the editor in the browser (bootstrap/app built with JAZYK_DEMO=1) to the
# jazyk.dev S3 bucket behind CloudFront on every push to master that touches the
# app or the compiler. The build compiles the crate to wasm, binds it, bundles the
# page, runs the browser tests against it, and bootstrap/app/deploy.sh syncs
# dist-demo/ and invalidates the distribution. Credentials come from the jazyk-site-deploy IAM role through
# GitHub's OIDC provider; no AWS secret is stored in this repository.

on:
  push:
    branches: [master]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/editor.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Allow one concurrent deployment, never cancel an in-progress one.
concurrency:
  group: editor
  cancel-in-progress: false

env:
  WASM_BINDGEN_VERSION: 0.2.128

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bootstrap
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bootstrap/app/package-lock.json
      - name: Install the wasm target and wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          wasm-bindgen --version
      - name: Build
        run: npm ci && npm run build:demo
        working-directory: bootstrap/app
      # The fixtures' diagrams are redrawn by the renderer this commit carries, so a
      # renderer change reaches the demos without a rebuild of the examples
      # (docs/frontends/wasm.md#keeping-the-demos-current).
      - name: Redraw the demo diagrams
        run: |
          cargo build --release --bin jazyk
          sh app/scripts/rerender-fixtures.sh target/release/jazyk app/dist-demo/demos
        working-directory: bootstrap
      # The editor's browser tests drive the built page; nothing publishes unless
      # they pass (docs/frontends/wasm.md#building).
      - name: Test in the browser
        run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: bootstrap/app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: bootstrap/app/test-results
          retention-days: 7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750984813907:role/jazyk-site-deploy
          aws-region: us-east-1
      - name: Deploy
        run: ./bootstrap/app/deploy.sh
