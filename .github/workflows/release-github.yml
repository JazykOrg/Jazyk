name: Publish native downloads
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
      - name: Verify release identity
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release/artifacts.py verify dist/release "$VERSION" "$GITHUB_SHA"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release/publish-github.py "$VERSION" "$GITHUB_SHA" dist/release
