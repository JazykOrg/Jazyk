name: Publish npm packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of an existing published GitHub Release'
        required: true
        type: string
      source_run_id:
        description: 'Completed Release workflow run containing the validated artifacts'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false
permissions:
  actions: read
  contents: read
  id-token: write
jobs:
  publish:
    concurrency:
      group: jazyk-npm-publish
      cancel-in-progress: false
    timeout-minutes: 75
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 scripts/release/verify-npm-source.py "$VERSION" dist/release "$SOURCE_RUN_ID"
      - name: Publish platform packages, then launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_PUBLIC: ${{ !github.event.repository.private }}
        run: node scripts/release/publish-npm.mjs "$VERSION" dist/release
