name: Release
run-name: Release ${{ inputs.version }} (publish=${{ inputs.publish }})
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching bootstrap/Cargo.toml, without v'
        required: true
        type: string
      publish:
        description: 'Publish GitHub Release and npm packages after validation'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: jazyk-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {version} from './scripts/release/prepare.mjs';
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(process.env.VERSION) || version() !== process.env.VERSION) throw new Error('Version must match Cargo.toml');
          const platforms=JSON.parse(fs.readFileSync('scripts/release/platforms.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify({include:Object.entries(platforms).map(([key,p])=>({key,...p}))})}\n`);
          JS
      - name: Check first-publication credentials
        if: inputs.publish
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$HAS_NPM_TOKEN" = true ]; then npm whoami --registry=https://registry.npmjs.org; fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if (process.env.HAS_NPM_TOKEN !== 'true') {
            const platforms=JSON.parse(fs.readFileSync('scripts/release/platforms.json'));
            for (const name of [...Object.keys(platforms).map(k=>`jazyk-${k}`),'jazyk']) {
              const response=await fetch(`https://registry.npmjs.org/${name}`,{signal:AbortSignal.timeout(30000)});
              if (!response.ok) throw new Error(`Set a short-lived NPM_TOKEN repository secret for initial publication: ${name} is not available (${response.status})`);
            }
          }
          JS
      - run: node --test scripts/release/launcher.test.cjs scripts/release/packaging.test.mjs
      - run: python3 scripts/release/publish-github.test.py
      - run: node --test scripts/release/publish-npm.test.mjs
      - run: python3 scripts/release/verify-npm-source.test.py
  shared-checks:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bootstrap
      - run: cargo check --locked --target wasm32-unknown-unknown --lib
        working-directory: bootstrap
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: runtime-worker/go.mod
          cache-dependency-path: runtime-worker/go.sum
      - run: go test ./...
        working-directory: runtime-worker
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bootstrap
          key: release-${{ matrix.key }}
          cache-on-failure: true
      - run: cargo build --locked --release --bin jazyk --example distribution_smoke
        working-directory: bootstrap
      - run: cargo test --locked --release
        working-directory: bootstrap
      - name: Bundle libraries and licenses
        env:
          KEY: ${{ matrix.key }}
        run: |
          binary=bootstrap/target/release/jazyk
          if [[ "$RUNNER_OS" = Windows ]]; then binary="$binary.exe"; fi
          python scripts/release/artifacts.py bundle "$KEY" "$binary" .local/distributions
          python scripts/release/artifacts.py archive .local/distributions .local/archives "$KEY"
          python scripts/release/artifacts.py extract "$KEY" .local/archives .local/extracted
      - name: Test complete distribution
        env:
          KEY: ${{ matrix.key }}
        run: |
          ext=''
          if [[ "$RUNNER_OS" = Windows ]]; then ext='.exe'; fi
          cp "bootstrap/target/release/examples/distribution_smoke$ext" ".local/extracted/$KEY/smoke$ext"
          env -u JAZYK_PLANTUML -u JAZYK_PDFIUM -u JAZYK_PROOF_PDFIUM ".local/extracted/$KEY/smoke$ext"
          rm ".local/extracted/$KEY/smoke$ext"
          ".local/extracted/$KEY/jazyk$ext" --help
          node scripts/release/prepare.mjs .local/extracted .local/packages "$KEY"
          node scripts/release/install-smoke.mjs .local/packages "$KEY"
          node scripts/release/fallback-smoke.cjs .local/packages .local/archives "$KEY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-${{ matrix.key }}
          path: .local/extracted/
          retention-days: 14
          if-no-files-found: error
  collect:
    needs: [plan, shared-checks, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: distribution-*
          path: .local/distributions
          merge-multiple: true
      - run: node scripts/release/collect.mjs .local/distributions dist/release
      - name: Verify complete artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release/artifacts.py verify dist/release "$VERSION" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/release/
          retention-days: 14
          if-no-files-found: error
  github-release:
    if: inputs.publish
    needs: collect
    permissions:
      contents: write
    uses: ./.github/workflows/release-github.yml
    with:
      version: ${{ inputs.version }}
  npm-publish:
    needs: github-release
    if: inputs.publish
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/release-npm.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
