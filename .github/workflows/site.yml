name: Deploy site

# Publishes site/ to the jazyk.org S3 bucket behind CloudFront on every push to
# master that touches the site. The site is plain static HTML (Tailwind via CDN),
# so there is no build step: site/deploy.sh syncs the directory as-is and
# invalidates the distribution. Credentials come from the jazyk-site-deploy IAM
# role through GitHub's OIDC provider; no AWS secret is stored in this repository.

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Allow one concurrent deployment, never cancel an in-progress one.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750984813907:role/jazyk-site-deploy
          aws-region: us-east-1
      - name: Deploy
        run: ./site/deploy.sh
