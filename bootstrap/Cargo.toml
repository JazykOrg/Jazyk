[package]
name = "jazyk"
version = "0.2.1"
edition = "2021"

# The crate is a library with two front doors: the native binary and the wasm
# backend (docs/frontends/wasm.md). `cdylib` is what wasm-bindgen links.
[lib]
name = "jazyk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "jazyk"
path = "src/main.rs"

[features]
default = ["native-documents"]
native-documents = ["dep:docx-rs", "dep:pdfium-render", "dep:tempfile", "dep:zip"]
document-proof = ["native-documents"]

[[example]]
name = "distribution_smoke"
required-features = ["native-documents"]

[[example]]
name = "document_proof"
required-features = ["document-proof"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
toml_edit = "0.22.27"
mustache = "0.9"
globset = "0.4"
sha2 = "0.10"
quick-xml = "0.38"
base64 = "0.22"
serde_norway = "0.9"
regex = "1.12.4"
# Shared CommonMark link parsing and URL path decoding, including WASM.
pulldown-cmark = { version = "0.13", default-features = false }
percent-encoding = "2"
form_urlencoded = "1"
# The per-session bearer token of the MCP-over-HTTP serving (docs/frontends/mcp.md).
getrandom = "0.3"
siphasher = "1"
anyhow = "1"
async-trait = "0.1"
maybe-async = "0.2.11"
futures = "0.3"
goose-agent = "=0.1.0-alpha.13"
goose-provider-types = "=0.1.0-alpha.13"
goose-context-management = { path = "vendor/goose-context-management" }
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "macros"] }
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Native only: a process, sockets, threads, a terminal, and the C renderer.
# Infrastructure comes from crates; only domain logic is hand-rolled (owner decision).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"
url = "2"
notify = "6"
fs2 = "0.4"
# ACP bridge (docs/frontends/acp.md): the official protocol SDK. Executor-agnostic
# (futures + async-io), driven by a block_on on a dedicated thread; no tokio outside gui/.
agent-client-protocol = "=2.2.0"
async-io = "2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
eventsource-stream = "0.2"
rmcp = { version = "=3.4.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
# GUI server (async runtime is scoped inside src/gui/; the rest of the binary stays sync).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# The page at jazyk.dev is another origin (docs/frontends/gui.md#serving): CORS for
# the admitted page origin and the resource policy header on every response.
tower-http = { version = "0.6", features = ["cors", "set-header"] }
open = "5"
# Session tokens compare in constant time (src/gui/server.rs, src/acp/http.rs).
subtle = "2"
# Program lookup on PATH, with PATHEXT on Windows (src/setup.rs which).
which = "8"
# The launcher menu (docs/frontends/cli.md#jazyk): raw mode and key events.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
jsonc-parser = { version = "0.33.1", features = ["serde", "serde_json"] }
# Native format readers. Minimal builds can disable the default feature.
docx-rs = { version = "=0.4.22", default-features = false, optional = true }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"], optional = true }
tempfile = { version = "3", optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate"], optional = true }
# Diagram renderer (docs/compiler/diagrams.md): PlantUML reimplemented in Rust, Graphviz
# linked as a prebuilt static archive fetched by the crate's own opt-in path (see
# .cargo/config.toml); resvg rasterizes the SVG where a surface needs pixels.
plantuml-little = { version = "=1.2026.2-4", default-features = false, features = ["metrics-ttf-parser"] }
resvg = "0.48"

[target.'cfg(windows)'.dependencies]
uds_windows = "=1.2.1"

# A command timeout kills the command's whole process group (src/sys.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The browser backend. `getrandom/js` is what lets the shared token minting build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["local"] }
gloo-timers = { version = "0.3", features = ["futures"] }


[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Performance"]

[dev-dependencies]
# Router tests drive the axum app in process (src/gui/server.rs).
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
