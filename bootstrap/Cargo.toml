[package]
name = "jazyk"
version = "0.2.0"
edition = "2021"

# The crate is a library with two front doors: the native binary and the wasm
# backend (docs/frontends/wasm.md). `cdylib` is what wasm-bindgen links.
[lib]
name = "jazyk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "jazyk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serde_norway = "0.9"
regex = "1.12.4"
# Shared CommonMark link parsing and URL path decoding, including WASM.
pulldown-cmark = { version = "0.13", default-features = false }
percent-encoding = "2"
# The per-session bearer token of the MCP-over-HTTP serving (docs/frontends/mcp.md).
getrandom = "0.3"

# Native only: a process, sockets, threads, a terminal, and the C renderer.
# Infrastructure comes from crates; only domain logic is hand-rolled (owner decision).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"
url = "2"
notify = "6"
# ACP bridge (docs/frontends/acp.md): the official protocol SDK. Executor-agnostic
# (futures + async-io), driven by a block_on on a dedicated thread; no tokio outside gui/.
agent-client-protocol = "2.0.0"
futures = "0.3"
async-io = "2"
# GUI server (async runtime is scoped inside src/gui/; the rest of the binary stays sync).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# The page at jazyk.dev is another origin (docs/frontends/gui.md#serving): CORS for
# the admitted page origin and the resource policy header on every response.
tower-http = { version = "0.6", features = ["cors", "set-header"] }
open = "5"
jsonc-parser = { version = "0.33.1", features = ["serde", "serde_json"] }
# Diagram renderer (docs/compiler/diagrams.md): PlantUML reimplemented in Rust, Graphviz
# linked as a prebuilt static archive fetched by the crate's own opt-in path (see
# .cargo/config.toml); resvg rasterizes the SVG where a surface needs pixels.
plantuml-little = { version = "=1.2026.2-4", default-features = false, features = ["metrics-ttf-parser"] }
resvg = "0.48"

# The browser backend. `getrandom/js` is what lets the shared token minting build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }


[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Performance"]

[dev-dependencies]
# Router tests drive the axum app in process (src/gui/server.rs).
tower = { version = "0.5", features = ["util"] }
