<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configure Jazyk endpoint</title>
<style>body{font:17px system-ui;max-width:32rem;margin:4rem auto;padding:1rem;color:#172522;background:#f7f9f8}label{display:block;margin:1rem 0}input{display:block;box-sizing:border-box;width:100%;padding:.7rem;font:inherit}button{font:inherit;padding:.7rem 1rem;background:#08796d;color:white;border:0;border-radius:.3rem}</style>
<h1>OpenAI-compatible endpoint</h1><p>These settings are saved privately on this computer.</p>
<form method="post" autocomplete="off"><label>Name<input name="name" required maxlength="64" pattern="[A-Za-z0-9_-]+" placeholder="e.g. Work"></label><label>Endpoint URL<input name="url" type="url" required placeholder="https://api.openai.com/v1"></label><label>Model<input name="model" required placeholder="Model ID"></label><label>API key<input name="key" type="password" autocomplete="off"></label><button>Save endpoint</button></form></html>
