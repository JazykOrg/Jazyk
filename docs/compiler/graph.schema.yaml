$schema: http://json-schema.org/draft-07/schema#
$id: https://jazyk.org/schemas/graph.json
title: Jazyk Graph Store
description: |-
  Definitions for the graph store files in the out directory:
  - graph/entities.yaml is a map of id to entity
  - graph/requirements.yaml is a map of id to requirement
  - graph/relationships.yaml is a map of id to relationship (derived, regenerated on commit)
  - graph/diagnostics.yaml is a map of id to diagnostic
  - graph/redirects.yaml is a map of absorbed id to surviving id (plain strings)
  - docs/<mirrored doc path>.yaml is one docRecord per source document
  - journal/<build>-<seq>.yaml is one journalEntry per committed changeset
  - status.yaml is one status object
definitions:
  severity:
    description: Diagnostic severity. 'none' is a recorded judgment that is not surfaced
    type: string
    enum:
      - error
      - warning
      - info
      - none
  relationshipType:
    description: Relationship type, from strongest to weakest
    type: string
    enum:
      - generalization
      - realization
      - composition
      - aggregation
      - association
      - dependency
      - reference
  coverageState:
    description: Coverage state of a reconciled section
    type: string
    enum:
      - covered
      - non-normative
  sourceRef:
    description: >-
      A located quote. 'doc' is the document path, 'section' the internal reference,
      'quote' the verbatim text located by string search
    type: object
    required:
      - doc
      - section
      - quote
    properties:
      doc:
        type: string
      section:
        type: string
      quote:
        type: string
  requirementEdge:
    description: An entity pair a requirement ties together
    type: object
    required:
      - a
      - b
    properties:
      a:
        type: string
        description: Entity id
      b:
        type: string
        description: Entity id
      type:
        description: Implied relationship type
        allOf:
          - $ref: '#/definitions/relationshipType'
        default: reference
  workItem:
    description: One scheduled unit of work, a task type and its target
    type: object
    required:
      - task
      - target
    properties:
      task:
        type: string
        enum:
          - align-doc
          - reconcile-doc
          - review-requirement
          - review-entity
      target:
        type: string
        description: Document path, entity id, or requirement id
      dirtySections:
        type: array
        items:
          type: string
      staleAnchors:
        type: array
        items:
          type: string
      proposals:
        description: Anchor ids an align-doc item must decide
        type: array
        items:
          type: string
  entity:
    description: One entry in graph/entities.yaml
    type: object
    required:
      - name
    properties:
      name:
        type: string
      aliases:
        type: array
        items:
          type: string
      definition:
        description: The single living definition, refined across builds
        type: string
      scope:
        type: string
        description: Visibility scope, part of the entity's natural key
        default: public
      mentions:
        description: The sections that talk about this entity
        type: array
        items:
          $ref: '#/definitions/sourceRef'
      confidence:
        type: number
        minimum: 0
        maximum: 1
      reasoning:
        type: string
      created:
        type: string
        description: Build marker set by the store on commit
      updated:
        type: string
        description: Build marker set by the store on commit
  requirement:
    description: One entry in graph/requirements.yaml
    type: object
    required:
      - ears
      - entities
      - source
    properties:
      ears:
        type: string
        description: The EARS statement
      entities:
        type: array
        minItems: 1
        items:
          type: string
          description: Entity id
      edges:
        type: array
        items:
          $ref: '#/definitions/requirementEdge'
      source:
        $ref: '#/definitions/sourceRef'
      confidence:
        type: number
        minimum: 0
        maximum: 1
      reasoning:
        type: string
      created:
        type: string
        description: Build marker set by the store on commit
      updated:
        type: string
        description: Build marker set by the store on commit
  relationship:
    description: One entry in graph/relationships.yaml. Derived from requirements on commit
    type: object
    required:
      - type
      - members
      - requirements
    properties:
      type:
        $ref: '#/definitions/relationshipType'
      members:
        description: The two entities the edge connects
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
      requirements:
        description: The requirements this edge is derived from
        type: array
        minItems: 1
        items:
          type: string
  diagnostic:
    description: One entry in graph/diagnostics.yaml. Sticky, reconciled across builds
    type: object
    required:
      - rule
      - severity
      - subjects
      - message
    properties:
      rule:
        type: string
      severity:
        $ref: '#/definitions/severity'
      subjects:
        description: Node ids this diagnostic is about
        type: array
        minItems: 1
        items:
          type: string
      message:
        type: string
      reasoning:
        description: Why this severity or disposition was chosen
        type: string
      lifecycle:
        type: string
        enum:
          - open
          - resolved
        default: open
      triage:
        description: Human-set state. Survives rebuilds
        type:
          - string
          - 'null'
        enum:
          - acknowledged
          - suppressed
          - wontfix
          - null
      prompt:
        $ref: '#/definitions/diagnosticPrompt'
      answer:
        description: Human response to the prompt. Set by frontends, never the compiler
        type: object
        required:
          - text
          - status
        properties:
          choice:
            description: Option index answered, absent for a freeform reply
            type: integer
            minimum: 0
          text:
            type: string
          status:
            type: string
            enum:
              - applied
              - handling
              - handled
              - failed
        additionalProperties: false
      created:
        type: string
        description: Build marker set by the store on commit
      updated:
        type: string
        description: Build marker set by the store on commit
  diagnosticPrompt:
    description: A question or proposal attached to a diagnostic
    type: object
    required:
      - question
    properties:
      question:
        type: string
      options:
        type: array
        maxItems: 4
        items:
          type: object
          required:
            - label
          properties:
            label:
              type: string
            edit:
              description: A suggested edit; applying it is deterministic
              type: object
              required:
                - doc
                - section
                - old_text
                - new_text
              properties:
                doc:
                  type: string
                section:
                  type: string
                old_text:
                  type: string
                new_text:
                  type: string
              additionalProperties: false
            answer:
              description: A prefilled reply, handled by the model over ACP
              type: string
          additionalProperties: false
      freeform:
        description: Whether a typed reply is accepted
        type: boolean
        default: false
    additionalProperties: false
  section:
    description: One entry in a docRecord's sections map, keyed by internal reference
    type: object
    required:
      - title
    properties:
      title:
        type: string
      kind:
        type: string
        enum:
          - root
          - heading
          - list-item
          - code-block
          - blockquote
          - diagram
      order:
        type: integer
        minimum: 0
        description: Position among siblings
      parent:
        type: string
        description: Internal reference of the parent. Absent on the root section
      raw:
        type: string
        description: Verbatim source text
      hash:
        type: string
        description: Content hash of raw, used for section diffing
      lines:
        description: Start and end line in the source file
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: integer
          minimum: 0
  coverage:
    description: >-
      One entry in a docRecord's coverage map, keyed by internal reference. A section
      with no entry is unprocessed
    type: object
    properties:
      state:
        $ref: '#/definitions/coverageState'
      note:
        type: string
        description: Required when state is non-normative
      claimedBy:
        type: string
        description: The journal entry of the changeset that set the state
  docRecord:
    description: One file under docs/, mirroring one source document
    type: object
    properties:
      contentHash:
        type: string
        description: Hash of the source file at last reconcile
      sections:
        type: object
        description: Map of internal reference to section
        additionalProperties:
          $ref: '#/definitions/section'
      coverage:
        type: object
        description: Map of internal reference to coverage
        additionalProperties:
          $ref: '#/definitions/coverage'
  journalEntry:
    description: One file under journal/, one per committed changeset
    type: object
    properties:
      build:
        type: string
        description: Build marker
      workItem:
        $ref: '#/definitions/workItem'
      mutations:
        description: The applied mutations, each an operation name with its arguments
        type: array
        items:
          type: object
      rounds:
        type: integer
        minimum: 0
        description: Message rounds the turn used
      tokens:
        type: integer
        minimum: 0
        description: Tokens the turn spent
  status:
    description: The status.yaml file
    type: object
    properties:
      generation:
        type: integer
        minimum: 0
        description: Bumped on every commit
      parked:
        description: Work items left open when the build budget ran out
        type: array
        items:
          $ref: '#/definitions/workItem'
      spent:
        type: object
        description: Budgets spent in the last build
        properties:
          turns:
            type: integer
            minimum: 0
          rounds:
            type: integer
            minimum: 0
          tokens:
            type: integer
            minimum: 0
      verdict:
        type: string
        description: Convergence verdict of the last build
        enum:
          - converged
          - incomplete
      alignment:
        description: Pending alignment proposals, one block per target document
        type: array
        items:
          $ref: '#/definitions/docAlignment'
      reevaluate:
        description: Anchors an align-doc turn placed with reevaluate, listed as stale anchors until addressed
        type: array
        items:
          type: string
  sectionOp:
    description: One computed section change
    type: object
    required:
      - op
    properties:
      op:
        type: string
        enum:
          - edited
          - moved
          - split
          - merged
          - deleted
          - added
      from:
        description: Old full references
        type: array
        items:
          type: string
      to:
        description: New full references
        type: array
        items:
          type: string
      similarity:
        type: number
        minimum: 0
        maximum: 1
  anchorCandidate:
    description: One candidate section for a proposed anchor
    type: object
    required:
      - section
      - similarity
      - quoteLocates
    properties:
      section:
        type: string
        description: Full reference, doc.md#/ref
      similarity:
        type: number
        minimum: 0
        maximum: 1
      quoteLocates:
        type: boolean
      nearest:
        type: string
        description: The best matching window when the quote does not locate
      excerpt:
        type: string
  anchorProposal:
    description: One anchor alignment could not place with certainty
    type: object
    required:
      - anchor
      - from
      - quote
      - candidates
    properties:
      anchor:
        type: string
        description: Requirement or entity id
      from:
        type: string
        description: Old full reference
      quote:
        type: string
      excerpt:
        type: string
        description: The old section around the quote
      candidates:
        type: array
        items:
          $ref: '#/definitions/anchorCandidate'
  docAlignment:
    description: The pending proposals of one target document
    type: object
    required:
      - doc
      - proposals
    properties:
      doc:
        type: string
      changes:
        type: array
        items:
          $ref: '#/definitions/sectionOp'
      proposals:
        type: array
        items:
          $ref: '#/definitions/anchorProposal'
