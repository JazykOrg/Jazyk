$schema: http://json-schema.org/draft-07/schema#
$id: https://jazyk.org/schemas/tools.json
title: Jazyk Tool Payloads
description: >-
  Input and output shapes for the tool registry. Each write tool has one request payload
  definition. Shared node shapes are referenced from graph.json. Every call is validated
  by the graph store's gates; a rejection is a toolError
definitions:
  focus:
    description: Hop quota per edge axis
    type: object
    properties:
      parents:
        type: integer
        minimum: 0
      mentions:
        type: integer
        minimum: 0
      requirements:
        type: integer
        minimum: 0
    additionalProperties: false
  contextRequest:
    description: Request payload of the context tool
    type: object
    required:
      - target
    properties:
      target:
        type: string
        description: A section reference, entity id, or requirement id
      focus:
        $ref: '#/definitions/focus'
      budget:
        type: integer
        minimum: 1
        description: Maximum pack size in characters
    additionalProperties: false
  contextResponse:
    description: Response of the context and expand tools
    type: object
    properties:
      pack:
        type: string
        description: The rendered context pack, compact markdown with node ids inline
      handles:
        description: Expansion handles for frontiers the budget cut off
        type: array
        items:
          type: object
          required:
            - handle
          properties:
            handle:
              $ref: '#/definitions/expansionHandle'
            description:
              type: string
            size:
              type: integer
              minimum: 0
              description: Approximate size of the omitted frontier in characters
  expansionHandle:
    description: A stable token naming an omitted frontier, accepted by the expand tool
    type: string
    pattern: '^h:'
  toolError:
    description: A rejected call. Names the violated rule and how to repair the call
    type: object
    required:
      - rule
      - message
    properties:
      rule:
        type: string
      message:
        type: string
  upsertEntity:
    description: >-
      Request payload of upsert_entity. Keys on name plus scope; a match updates instead
      of duplicating. Returns the entity id and whether it was created
    type: object
    required:
      - name
      - mention
    properties:
      name:
        type: string
      definition:
        type: string
      aliases:
        type: array
        items:
          type: string
      scope:
        type: string
        default: public
      mention:
        description: Where the entity is mentioned. 'section' is a full section reference
        type: object
        required:
          - section
          - quote
        properties:
          section:
            type: string
          quote:
            type: string
        additionalProperties: false
      note:
        type: string
        description: Required when the name looks like syntax rather than a concept
    additionalProperties: false
  updateEntity:
    description: Request payload of update_entity. A rename keeps the id
    type: object
    required:
      - id
    properties:
      id:
        type: string
      name:
        type: string
      definition:
        type: string
      add_aliases:
        type: array
        items:
          type: string
    additionalProperties: false
  deleteEntity:
    description: >-
      Request payload of delete_entity. Rejected while any requirement references the
      entity
    type: object
    required:
      - id
      - reason
    properties:
      id:
        type: string
      reason:
        type: string
    additionalProperties: false
  mergeEntities:
    description: >-
      Request payload of merge_entities. The store rewires references and leaves a
      redirect from the absorbed id to the survivor
    type: object
    required:
      - keep
      - absorb
      - reason
    properties:
      keep:
        type: string
        description: Entity id that survives
      absorb:
        type: string
        description: Entity id that is absorbed
      reason:
        type: string
    additionalProperties: false
  upsertRequirement:
    description: >-
      Request payload of upsert_requirement. The store mints the id; a supplied id is
      ignored. The natural key (section plus punctuation-insensitive statement) makes
      the call idempotent; a match resolves at stage time and returns the existing id
      with updated true
    type: object
    required:
      - ears
      - entities
      - section
      - quote
    properties:
      ears:
        type: string
        description: The EARS statement
      entities:
        type: array
        minItems: 1
        items:
          type: string
          description: Entity id
      section:
        type: string
        description: Full section reference the statement comes from
      quote:
        type: string
        description: Verbatim text from the section
      edges:
        description: Entity pairs the statement ties together
        type: array
        items:
          $ref: 'graph.json#/definitions/requirementEdge'
    additionalProperties: false
  updateRequirement:
    description: >-
      Request payload of update_requirement. section plus quote re-anchor the
      provenance; the quote must locate verbatim in the section
    type: object
    required:
      - id
    properties:
      id:
        type: string
      ears:
        type: string
      entities:
        type: array
        minItems: 1
        items:
          type: string
      edges:
        type: array
        items:
          $ref: 'graph.json#/definitions/requirementEdge'
      section:
        type: string
        description: Full section reference the revised statement comes from
      quote:
        type: string
        description: Verbatim text from the section
    additionalProperties: false
  deleteRequirement:
    description: Request payload of delete_requirement
    type: object
    required:
      - id
      - reason
    properties:
      id:
        type: string
      reason:
        type: string
    additionalProperties: false
  placeAnchor:
    description: >-
      Request payload of place_anchor. Moves one proposed anchor to a section; the
      align-doc turn only
    type: object
    required:
      - id
      - section
      - reevaluate
    properties:
      id:
        type: string
        description: A requirement or entity id named by the work item's proposals
      section:
        type: string
        description: Target section reference, /ref or doc.md#/ref
      quote:
        type: string
        description: Replacement quote; must locate in the target section
      reevaluate:
        type: boolean
        description: List the anchor as a stale anchor for the target document's reconcile-doc turn
    additionalProperties: false
  orphanAnchor:
    description: Request payload of orphan_anchor. Leaves one proposed anchor homeless
    type: object
    required:
      - id
    properties:
      id:
        type: string
    additionalProperties: false
  reportDiagnostic:
    description: Request payload of report_diagnostic
    type: object
    required:
      - rule
      - severity
      - subjects
      - message
      - reasoning
    properties:
      rule:
        type: string
      severity:
        $ref: 'graph.json#/definitions/severity'
      subjects:
        type: array
        minItems: 1
        items:
          type: string
          description: Node id
      message:
        type: string
      reasoning:
        type: string
      prompt:
        $ref: 'graph.json#/definitions/diagnosticPrompt'
    additionalProperties: false
  updateDiagnostic:
    description: Request payload of update_diagnostic
    type: object
    required:
      - id
    properties:
      id:
        type: string
      prompt:
        oneOf:
          - $ref: 'graph.json#/definitions/diagnosticPrompt'
          - type: 'null'
    additionalProperties: false
  answerDiagnostic:
    description: Request payload of answer_diagnostic (chat toolset)
    type: object
    required:
      - id
    properties:
      id:
        type: string
      option:
        description: Option index chosen
        type: integer
        minimum: 0
      text:
        description: Freeform reply
        type: string
    additionalProperties: false
  resolveDiagnostic:
    description: Request payload of resolve_diagnostic
    type: object
    required:
      - id
      - reason
    properties:
      id:
        type: string
      reason:
        type: string
    additionalProperties: false
  setCoverage:
    description: Request payload of set_coverage
    type: object
    required:
      - section
      - state
    properties:
      section:
        type: string
        description: Full section reference
      state:
        $ref: 'graph.json#/definitions/coverageState'
      note:
        type: string
        description: Required when state is non-normative
    additionalProperties: false
  done:
    description: Request payload of done. Ends the turn and requests commit
    type: object
    required:
      - summary
    properties:
      summary:
        type: string
    additionalProperties: false
  reportFeedback:
    description: >-
      Request payload of report_feedback. Feedback about jazyk's own prompts and tools,
      never about the project's documents
    type: object
    required:
      - kind
      - message
    properties:
      kind:
        type: string
        enum:
          - ambiguous
          - wrong
          - confusing
          - missing
          - other
        description: An unrecognized value is recorded as other
      subject:
        type: string
        description: What the feedback is about, e.g. a tool name, an argument, an instruction
      message:
        type: string
        description: What was unclear and what would have helped
    additionalProperties: false
  reportFeedbackResponse:
    description: Response of report_feedback
    type: object
    properties:
      recorded:
        type: boolean
        description: False when the turn's feedback cap is already spent
      note:
        type: string
    additionalProperties: false
  feedbackEntry:
    description: >-
      One line of the feedback log at <out>/feedback.jsonl. The payload plus the
      references identifying the caller
    type: object
    required:
      - at
      - kind
      - message
    properties:
      at:
        type: string
        description: ISO 8601 timestamp
      kind:
        type: string
      subject:
        type: string
      message:
        type: string
      source:
        type: string
        enum:
          - turn
          - mcp
        description: The harness the call came through
      task:
        type: string
        description: Task type of the turn, or the MCP serving mode
      target:
        type: string
        description: The turn's work item target. Absent for an MCP session, which has none
      model:
        type: string
      codec:
        type: string
        enum:
          - native
          - text
      generation:
        type: integer
        minimum: 0
        description: Store generation when the call was made
      run:
        type: string
        description: Transcript name under <out>/trace, when the call came from a traced run
      client:
        type: string
        description: MCP client name reported at initialize
    additionalProperties: false
