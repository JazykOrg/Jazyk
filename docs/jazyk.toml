#:schema = ./compiler/project-settings.schema.yaml

[docs]
glob = [
    "**/*.md",
    # Benchmark case files are fixtures, not documentation. Compiling them would leak
    # their planted entities (Cart, ABC) into the project graph.
    "!benchmark/cases/**",
    # Prompt payloads are what the turns say to the model, embedded into the binary
    # verbatim at compile time. They are instructions to a model, not statements
    # about jazyk; compiling them would extract their imperatives as requirements.
    "!compiler/turns/prompts/**",
]

[docs.linting.rules]
warnings = [
    "An em dash appears in prose. This documentation uses commas, periods, parentheses, or colons instead.",
]

[roots]
files = ["main.md"]

[gen]
deliverable = "../project2"
