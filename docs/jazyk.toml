#:schema = ./compiler/project-settings.schema.yaml

[docs]
glob = [
    "**/*.md",
    # Benchmark case files are fixtures, not documentation. Compiling them would leak
    # their planted entities (Cart, ABC) into the project graph.
    "!benchmark/cases/**",
    # Goal prompt payloads (the agent contract, one contract paragraph per goal kind,
    # the generation payloads) are what a session says to the model, embedded into the
    # binary verbatim at compile time. They are instructions to a model, not statements
    # about jazyk; compiling them would extract their imperatives as requirements.
    "!compiler/goals/prompts/**",
    # Skills are payloads of the same kind: the working knowledge for one shape, loaded
    # into a session on demand and embedded the same way. Same reason to exclude them.
    "!compiler/skills/**",
]

[docs.linting.rules]
warnings = [
    "An em dash appears in prose. This documentation uses commas, periods, parentheses, or colons instead.",
]

[roots]
files = ["main.md"]

[gen]
deliverable = "../project2"
