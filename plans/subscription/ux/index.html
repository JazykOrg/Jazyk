<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jazyk · Project workflow proposal</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="review-bar"><span><strong>INTERACTIVE PROPOSAL</strong> Sample projects. No payments or files are changed.</span><div><button data-action="scope">In / out</button><button data-action="reset">Reset demo</button></div></div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-action="home"><span class="brand-mark">j.</span> jazyk<span class="brand-domain">.dev</span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <button class="nav-item active" data-action="home"><span>▦</span> Projects <span class="nav-count" id="project-count">4</span></button>
      <button class="nav-item" data-action="account"><span>◌</span> AI &amp; usage</button>
      <div class="sidebar-spacer"></div>
      <div class="connection"><span class="status-dot"></span><div><strong>This computer</strong><small>Jazyk connected</small></div><button aria-label="Connection details" data-action="connection">↗</button></div>
      <button class="account" data-action="account"><span class="avatar">MT</span><span><strong>Demo account</strong><small id="account-state">Explore subscription</small></span><span>⌄</span></button>
    </aside>
    <main id="main"></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
